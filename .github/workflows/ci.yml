name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet format whitespace --verify-no-changes --no-restore
      - run: dotnet test -c Release --no-restore --logger trx
      - run: dotnet pack src/LibMentor.Cli -c Release --no-restore -o artifacts
      - name: Install and test packed tool
        shell: pwsh
        run: ./scripts/smoke-test.ps1
      - name: Generate LibMentor documentation
        run: dotnet run --project src/LibMentor.Cli -c Release --no-build -- generate --revision "${{ github.sha }}"
      - name: Verify documentation output
        run: dotnet run --project src/LibMentor.Cli -c Release --no-build -- generate --check --revision "${{ github.sha }}"
      - name: Assemble documentation website
        shell: pwsh
        run: ./scripts/build-site.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: |
            artifacts/*.nupkg
            artifacts/site
            **/TestResults/*.trx
