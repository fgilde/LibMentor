name: Library integrations
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet pack src/LibMentor.Cli -c Release -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: integration-cli
          path: artifacts/*.nupkg
  validate:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: Nextended
            revision: 45ba2b6059b81a87ec22ec1cb9b4c33584a7a7ad
          - repository: CoworkeeLib
            revision: 54764f15a9ae03ab36701532d6b41b82467170e0
          - repository: AirWorks
            revision: f0a21ca803e58ea28bcaa09c0aa368293af73397
          - repository: MudBlazor.Extensions
            revision: 50d2f210c1f1d5060f328f6381c1f58c41cf2be7
          - repository: BlazorJS
            revision: c5da5d571ff643d848f546ba8a17556f4ea8db2b
          - repository: Playzor
            revision: 4c52fccdb7e57355e24d1b42a033437a9297c2b4
    steps:
      - uses: actions/checkout@v4
        with:
          repository: fgilde/${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          path: consumer
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: integration-cli
          path: packages
      - name: Install the built CLI
        shell: bash
        run: |
          version="$(python3 -c 'import zipfile,glob,xml.etree.ElementTree as E; z=zipfile.ZipFile(glob.glob("packages/*.nupkg")[0]); n=next(p for p in z.namelist() if p.endswith(".nuspec")); r=E.fromstring(z.read(n)); print(next(e.text for e in r.iter() if e.tag.rsplit("}",1)[-1]=="version"))')"
          dotnet tool install LibMentor --tool-path "$RUNNER_TEMP/libmentor" --add-source "$GITHUB_WORKSPACE/packages" --version "$version"
      - uses: actions/setup-node@v4
        if: matrix.repository == 'AirWorks'
        with:
          node-version: 24
      - name: Install AirWorks dependencies
        if: matrix.repository == 'AirWorks'
        working-directory: consumer/src/airworks
        run: npm ci
      - name: Extract the AirWorks API
        if: matrix.repository == 'AirWorks'
        working-directory: consumer/src/airworks
        run: npx --yes --package typedoc@0.28.14 --package typescript@5.9.3 typedoc --tsconfig tsconfig.lib.json --entryPoints src/index.ts --json ../../.libmentor-inputs/typedoc.json
      - name: Generate and check library documentation
        shell: bash
        run: |
          revision="$(git -C consumer rev-parse HEAD)"
          version="$(cd consumer && GITHUB_SHA="$revision" python3 .github/scripts/libmentor-version.py)"
          "$RUNNER_TEMP/libmentor/libmentor" generate --config consumer/libmentor.json --revision "$revision" --library-version "$version"
          "$RUNNER_TEMP/libmentor/libmentor" generate --config consumer/libmentor.json --check --revision "$revision" --library-version "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-${{ matrix.repository }}
          path: consumer/.libmentor
          include-hidden-files: true
